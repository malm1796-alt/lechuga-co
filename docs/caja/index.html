<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101923">
<meta name="robots" content="noindex">
<title>Caja · Lechuga &amp; Co.</title>
<link rel="icon" href="../marca/icono-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../marca/icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caja L&amp;C">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Caja de Lechuga & Co.: encabezado fijo con pestañas y una superficie de trabajo por pestaña. Azul noche y dorado de la marca. */
:root{
  --bg:#f5f4f0; --surface:#ffffff; --sunk:#ecebe5; --ink:#101923; --muted:#5f6872; --line:#e2e0d9;
  --denim:#101923; --on-denim:#ffffff; --thread:#b88a33; --thread-soft:#f6ecd6;
  --good:#1d7f55; --good-soft:#dcf1e7; --bad:#b83434; --bad-soft:#f8dfdf; --warn:#9a6a00; --warn-soft:#fbefd2;
  --f-display:"Montserrat", "Segoe UI", system-ui, sans-serif;
  --f-body:"Poppins", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1118; --surface:#131c26; --sunk:#1a2531; --ink:#eef0f2; --muted:#9aa4ae; --line:#26323f;
  --denim:#d5a64b; --on-denim:#101923; --thread:#d5a64b; --thread-soft:#2d2716;
  --good:#5fd39d; --good-soft:#163829; --bad:#ff8a8a; --bad-soft:#3d1c1f; --warn:#f3c55a; --warn-soft:#3a3016; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1118; --surface:#131c26; --sunk:#1a2531; --ink:#eef0f2; --muted:#9aa4ae; --line:#26323f;
  --denim:#d5a64b; --on-denim:#101923; --thread:#d5a64b; --thread-soft:#2d2716;
  --good:#5fd39d; --good-soft:#163829; --bad:#ff8a8a; --bad-soft:#3d1c1f; --warn:#f3c55a; --warn-soft:#3a3016; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.top .mark{width:30px;flex:none}
.top h1{font-family:var(--f-display);font-weight:800;font-size:1.2rem;margin:0;letter-spacing:-.01em;line-height:1.1}
.top .sub{color:var(--muted);font-size:.8rem}
.top .grow{flex:1;min-width:0}
.top .today{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);text-align:right}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:0 8px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:transparent;color:var(--muted);font:600 .9rem var(--f-body);padding:8px 12px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--denim);color:var(--on-denim)}
nav.tabs button:hover:not([aria-current]){background:var(--sunk);color:var(--ink)}
main{padding-block:20px 60px;display:grid;gap:20px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:-.015em;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:1.6rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .h{font-size:.8rem;color:var(--muted)}
.kpi.hero{background:var(--denim);color:var(--on-denim);border-color:var(--denim);position:relative;overflow:hidden}
.kpi.hero .eyebrow,.kpi.hero .h{color:inherit;opacity:.8}
.kpi.hero::after{content:"";position:absolute;inset:6px;border:1.5px dashed var(--thread);border-radius:7px;pointer-events:none;opacity:.8}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
button,.btn{font:600 .9rem var(--f-body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
button:hover,.btn:hover{background:var(--sunk)}
.primary{background:var(--denim);color:var(--on-denim);border-color:var(--denim)}
.primary:hover{background:var(--denim);filter:brightness(1.12)}
.wa{background:#1f9d55;color:#fff;border-color:#1f9d55}
.wa:hover{background:#1a8a4a}
.ghost{border-color:transparent;background:transparent}
.danger{color:var(--bad)}
.tiny{padding:4px 9px;font-size:.8rem}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--thread);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
label{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:500 .95rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{font-family:var(--f-mono);font-size:.8rem}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.form .full{grid-column:1/-1}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ex{background:var(--thread-soft);color:var(--thread)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:999px;padding:5px 12px;font-size:.82rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-size:.9rem}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}
/* POS */
.pos{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,380px);align-items:start}
@media (max-width:860px){.pos{grid-template-columns:minmax(0,1fr)}}
.prods{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.prod{text-align:left;display:grid;gap:4px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;font-weight:500}
.prod:hover{border-color:var(--denim);background:var(--surface)}
.prod .n{font-weight:700;font-size:.92rem;line-height:1.25}
.prod .p{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.prod .meta{font-size:.75rem;color:var(--muted)}
.prod.out{opacity:.6}
.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px)}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding-block:8px;border-bottom:1px dashed var(--line)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{padding:2px 9px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-weight:800;font-size:1.6rem}
/* Ticket */
.ticket{font-family:var(--f-mono);font-size:.82rem;background:var(--bg);border:1px dashed var(--muted);border-radius:6px;padding:14px;white-space:pre-wrap;line-height:1.5}
/* Reports */
.stmt td:first-child{white-space:normal}
.stmt tr.sum td{font-weight:700;border-top:2px solid var(--ink)}
.stmt tr.big td{font-family:var(--f-display);font-size:1.05rem;font-weight:800}
.stmt tr.sect td{background:var(--sunk);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stmt td.ind{padding-left:28px}
.pos-v{color:var(--good)} .neg-v{color:var(--bad)}
/* Chart */
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .bar{fill:var(--denim)}
.chart .bar.now{fill:var(--thread)}
.chart .grid{stroke:var(--line)}
/* Brand */
.swatches{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.sw{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sw .c{height:80px}
.sw .t{padding:8px 10px;font-size:.8rem}
.brandhero{display:grid;gap:24px;grid-template-columns:auto minmax(0,1fr);align-items:center}
@media (max-width:600px){.brandhero{grid-template-columns:minmax(0,1fr);justify-items:start}}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,6vw,3.6rem);letter-spacing:-.035em;line-height:.95;text-wrap:balance}
.seam{height:0;border-top:2px dashed var(--thread);margin-block:4px}
.lockups{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.lockup{border-radius:var(--r);padding:20px;display:flex;align-items:center;gap:14px;min-height:120px}
.lockup .wm{font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;line-height:1}
.msg{background:var(--good-soft);color:var(--ink);border-radius:10px 10px 10px 2px;padding:10px 12px;font-size:.9rem;max-width:46ch;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.overlay{position:fixed;inset:0;background:rgba(10,14,28,.55);z-index:15;display:grid;place-items:center;padding:16px}
.overlay .card{width:min(720px,100%);max-height:85vh;overflow:auto;display:grid;gap:12px}
@media (prefers-reduced-motion:no-preference){.prod,button{transition:background .15s,border-color .15s}}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.thumb{width:44px;height:58px;object-fit:cover;border-radius:4px;background:var(--sunk);display:block}
.prod img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;background:var(--sunk)}
.login{max-width:380px;margin:8vh auto 0;display:grid;gap:14px;justify-items:start}
.login form{display:grid;gap:12px;width:100%}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow .node{border:1.5px dashed var(--thread);border-radius:8px;padding:8px 12px;font-weight:700;background:var(--surface)}
.flow .arrow{color:var(--muted)}
code.url{font-family:var(--f-mono);font-size:.82rem;background:var(--sunk);padding:2px 6px;border-radius:4px;word-break:break-all}
/* Editor de catálogo: ventana a pantalla completa con lista, formulario y vista previa de la página. */
.ed{position:fixed;inset:0;z-index:18;background:var(--bg);display:grid;grid-template-rows:auto auto 1fr;padding-top:env(safe-area-inset-top,0px)}
.ed-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.ed-ask{margin:10px 16px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ed-body{display:grid;grid-template-columns:290px minmax(0,1fr) 330px;min-height:0;grid-row:3}
.ed-list{overflow:auto;border-right:1px solid var(--line);padding:14px;display:grid;gap:6px;align-content:start}
.ed-item{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:6px;border-radius:8px;border:1px solid transparent;background:transparent;font-weight:400}
.ed-item:hover{background:var(--surface)}
.ed-item[aria-current]{border-color:var(--denim);background:var(--surface)}
.ed-item img,.ed-item .ed-noph{width:46px;height:58px;object-fit:cover;border-radius:4px}
.ed-item b{display:block;font-size:.86rem;line-height:1.25}
.ed-noph{display:grid;place-items:center;background:#101923;border-radius:4px}
.ed-form{overflow:auto;padding:16px;display:grid;gap:14px;align-content:start}
.ed-sec{display:grid;gap:12px}
.ed-color{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px}
.photo-drop{position:relative;width:170px;aspect-ratio:4/5;max-width:100%;border:2px dashed var(--line);border-radius:8px;display:grid;place-items:center;overflow:hidden;background:var(--sunk);cursor:pointer}
.photo-drop img{width:100%;height:100%;object-fit:cover}
.photo-drop.over{border-color:var(--thread);background:var(--thread-soft)}
.photo-drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ed-sw{display:inline-block;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);flex:none}
.ed-tbl td{padding:5px 6px}
.ed-tbl input{padding:6px 8px;font-size:.88rem}
.ed-off td{opacity:.45}
.ed-prev{overflow:auto;border-left:1px solid var(--line);padding:16px;background:var(--sunk)}
.pv-card,.pv-sheet{background:#fff;color:#101923;border-radius:8px;overflow:hidden;font-family:"Poppins",sans-serif}
.pv-sheet{padding:14px;display:grid;gap:8px}
.pv-ph{position:relative;aspect-ratio:4/5;max-width:100%;background:#eeece6;overflow:hidden;border-radius:6px}
.pv-ph img{width:100%;height:100%;object-fit:cover;display:block}
.pv-card .pv-ph{border-radius:0}
.pv-info{padding:10px 14px 14px;display:grid;gap:3px}
.pv-info b{font:600 .9rem "Montserrat",sans-serif}
.pv-price{font:700 1rem "Montserrat",sans-serif;color:#b88a33}
.pv-flag{position:absolute;top:8px;left:8px;background:#d5a64b;color:#101923;padding:2px 8px;font:800 .58rem "Montserrat",sans-serif;letter-spacing:.14em;text-transform:uppercase}
.pv-chip{display:inline-flex;gap:6px;align-items:center;border:1.5px solid #101923;border-radius:4px;padding:5px 9px;background:#fff;color:#101923;font:700 .74rem "Montserrat",sans-serif}
.pv-chip[aria-pressed="true"]{background:#101923;color:#fff}
.pv-chip:hover{background:#f3f1ea}
.pv-chip[aria-pressed="true"]:hover{background:#101923}
@media (max-width:1180px){.ed-body{grid-template-columns:240px minmax(0,1fr)}.ed-prev{display:none}}
@media (max-width:760px){.ed-body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;overflow:auto}.ed-list{max-height:220px;border-right:0;border-bottom:1px solid var(--line)}.ed-color{grid-template-columns:minmax(0,1fr)}.ed-form{overflow:visible}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="mark" id="hdr-logo"></div>
    <div class="grow"><h1 id="hdr-name">Mi Tienda</h1><div class="sub" id="hdr-tag"></div></div>
    <div class="today" id="hdr-today"></div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" aria-label="Secciones"></nav></div>
</header>
<div class="wrap"><main id="main"><div class="empty">Cargando la tienda…</div></main></div>
<div id="editor" class="ed" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="overlay" class="overlay" hidden></div>
<script>
const TABS=[["hoy","Hoy"],["vender","Vender"],["catalogo","Catálogo"],["clientes","Clientes"],["movs","Gastos y compras"],["reportes","Estados financieros"],["conexiones","Conexiones"],["publicidad","Publicidad"],["marca","Marca"],["ajustes","Ajustes"]];
// Dónde está el servidor: en la PC de la tienda es la misma dirección; desde GitHub Pages es la del túnel,
// que tunel.js publica en config.json cada vez que la PC enciende.
const REMOTE=/github\.io$/i.test(location.hostname);
let API=(()=>{let o="";try{o=localStorage.getItem("lc-api")||""}catch{}
  if(o)return o.replace(/\/$/,"");
  if(REMOTE)try{return localStorage.getItem("lc-tunel")||""}catch{return ""}
  return location.origin})();
async function refreshApi(){
  if(!REMOTE)return false;
  try{const c=await (await fetch("../config.json?t="+Date.now(),{cache:"no-store"})).json(),u=String(c.api||"").replace(/\/$/,"");
    if(u&&u!==API){API=u;try{localStorage.setItem("lc-tunel",u)}catch{}return true}}catch{}
  return false;
}
let TOKEN=null;try{TOKEN=localStorage.getItem("lc-token")}catch{}
const EXP_CATS=["Renta","Nómina","Luz y agua","Internet y teléfono","Publicidad","Empaque y bolsas","Comisiones bancarias","Transporte","Mantenimiento","Impuestos","Otros"];
const DRAW="Retiro del dueño";
// Categorías y temporadas las administra el dueño desde Catálogo; vienen del servidor.
const LISTS={categories:{one:"categoría",many:"Categorías",field:"category",ph:"Ej. Pijamas"},seasons:{one:"temporada",many:"Temporadas",field:"season",ph:"Ej. Primavera-Verano 2028"}};
const listOf=kind=>S.settings[kind]||[];
const METHODS=["Efectivo","Tarjeta","Transferencia"];
const BRAND={night:"#101923",gold:"#d5a64b",grey:"#b9bcc0",white:"#ffffff"};
const NO_SEASON="Sin temporada";
const DEFAULTS={name:"Lechuga & Co.",tagline:"Ropa fresca de temporada",phone:"",address:"",currency:"MXN",openingCash:0,fixedAssets:0,liabilities:0};
const S={products:[],sales:[],expenses:[],purchases:[],settings:{...DEFAULTS},ready:false,me:null,version:0,err:null,users:null,pub:null};
const UI={tab:"hoy",cart:[],q:"",cat:"",season:"",discount:0,period:"mes",offset:0,editing:null,lastSale:null,confirm:null,mov:"gastos"};
const isAdmin=()=>S.me&&S.me.role==="admin";
const photoUrl=p=>p&&p.photo?API+"/api/fotos/"+encodeURIComponent(p.id)+"?v="+p.photo:"";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0};
const money=n=>{try{return new Intl.NumberFormat("es-MX",{style:"currency",currency:S.settings.currency||"MXN"}).format(n||0)}catch{return "$"+(n||0).toFixed(2)}};
const pct=n=>isFinite(n)?(n*100).toFixed(1)+"%":"—";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fdate=(t,o)=>new Date(t).toLocaleDateString("es-MX",o||{day:"numeric",month:"short",year:"numeric"});
const ftime=t=>new Date(t).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
const folio=t=>"#"+t.toString(36).slice(-6).toUpperCase();
const phoneDigits=p=>{let d=String(p||"").replace(/\D/g,"");if(d.length===10)d="52"+d;return d};
const waLink=(phone,text)=>"https://wa.me/"+phoneDigits(phone)+"?text="+encodeURIComponent(text);

function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
/* ---------- servidor ---------- */
async function api(method,path,body){
  if(!API)throw new Error("Esta caja no sabe dónde está el servidor. Enciende la PC de la tienda (iniciar.bat).");
  let r;
  try{r=await fetch(API+path,{method,headers:{"Content-Type":"application/json",...(TOKEN?{Authorization:"Bearer "+TOKEN}:{})},body:body?JSON.stringify(body):undefined})}
  catch{throw new Error("Sin conexión con la PC de la tienda. Revisa que esté encendida y con internet.")}
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&path!=="/api/login"){logout("Tu sesión terminó. Vuelve a entrar.");throw new Error("Tu sesión terminó.")}
  if(!r.ok)throw new Error(j.error||"El servidor respondió con un error.");
  return j;
}
async function load(){
  const st=await api("GET","/api/estado");
  Object.assign(S,{products:st.products,sales:st.sales,expenses:st.expenses,purchases:st.purchases,customers:st.customers||[],settings:{...DEFAULTS,...st.settings},me:st.me,version:st.version,ready:true,err:null});
  schedule();
}
const COLMAP={products:"products",sales:"sales",expenses:"expenses",purchases:"purchases",photos:"fotos"};
async function put(col,id,data){
  try{await api("PUT",col==="config"?"/api/ajustes":"/api/"+COLMAP[col]+"/"+encodeURIComponent(id),data);await load()}
  catch(e){toast(e.message);throw e}
}
async function del(col,id){
  try{await api("DELETE","/api/"+COLMAP[col]+"/"+encodeURIComponent(id));await load()}
  catch(e){toast(e.message);throw e}
}
function strip(o){const {id,photo,...r}=o;return r}
function logout(msg){TOKEN=null;try{localStorage.removeItem("lc-token")}catch{}Object.assign(S,{ready:false,me:null,loginMsg:msg||""});schedule()}

let rq=0;function schedule(){if(!rq)rq=requestAnimationFrame(()=>{rq=0;render()})}

async function boot(){
  render();
  await refreshApi();render();
  // Si todavía no hay ninguna cuenta y estamos en la PC de la tienda, se muestra el formulario de la primera cuenta.
  if(!TOKEN&&API)try{const h=await (await fetch(API+"/api/salud")).json();if(h.primeraVez&&h.local){S.firstRun=true;lastKey="";render()}}catch{}
  if(TOKEN)try{await load()}catch(e){S.err=e.message;schedule()}
  setInterval(async()=>{
    if(!TOKEN||document.hidden)return;
    try{const v=await api("GET","/api/version");if(v.version!==S.version||!S.ready)await load();else if(S.err){S.err=null;schedule()}}
    catch(e){if(!TOKEN)return;if(await refreshApi()){try{await load();return}catch{}}S.err=e.message;schedule()}
  },15000);
}
function resizeImage(file,max=900,q=.78){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",q))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("No se pudo leer la foto"))};img.src=u})}

/* ---------- calculations ---------- */
const activeProducts=()=>S.products.filter(p=>p.active!==false).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
function stockMap(until=Infinity){
  const m={};
  S.products.forEach(p=>m[p.id]=(p.createdAt||0)<until?(p.stock0||0):0);
  S.purchases.forEach(p=>{if(p.ts<until&&m[p.pid]!==undefined)m[p.pid]+=p.qty||0});
  S.sales.forEach(s=>{if(s.ts<until)(s.items||[]).forEach(i=>{if(m[i.pid]!==undefined)m[i.pid]-=i.qty||0})});
  return m;
}
function pnl(a,b){
  const r={n:0,units:0,bruto:0,neto:0,cogs:0,aj:0,byCat:{},opex:0,draws:0,byMethod:{},byPCat:{},top:{}};
  const pc={},pz={};r.bySeason={};S.products.forEach(p=>{pc[p.id]=p.category||"Sin categoría";pz[p.id]=p.season||NO_SEASON});
  S.sales.forEach(s=>{if(s.ts<a||s.ts>=b)return;r.n++;r.bruto+=s.subtotal??s.total;r.neto+=s.total;
    r.byMethod[s.method]=(r.byMethod[s.method]||0)+s.total;
    const f=(s.subtotal||s.total)?s.total/(s.subtotal||s.total):1;
    (s.items||[]).forEach(i=>{r.cogs+=i.qty*(i.cost||0);r.units+=i.qty;const k=pc[i.pid]||"Sin categoría";r.byPCat[k]=(r.byPCat[k]||0)+i.qty*i.price*f;
      const z=r.bySeason[pz[i.pid]||NO_SEASON]||(r.bySeason[pz[i.pid]||NO_SEASON]={q:0,v:0,c:0});z.q+=i.qty;z.v+=i.qty*i.price*f;z.c+=i.qty*(i.cost||0);
      const t=r.top[i.name]||(r.top[i.name]={q:0,v:0});t.q+=i.qty;t.v+=i.qty*i.price*f})});
  S.purchases.forEach(p=>{if(p.type==="ajuste"&&p.ts>=a&&p.ts<b)r.aj+=p.total||0});
  S.expenses.forEach(e=>{if(e.ts<a||e.ts>=b)return;if(e.category===DRAW)r.draws+=e.amount;else{r.byCat[e.category]=(r.byCat[e.category]||0)+e.amount;r.opex+=e.amount}});
  r.desc=r.bruto-r.neto;r.bruta=r.neto-r.cogs+r.aj;r.net=r.bruta-r.opex;
  return r;
}
function balance(t,periodStart){
  const st=S.settings,oc=num(st.openingCash),fa=num(st.fixedAssets),L=num(st.liabilities);
  let cash=oc,inv0=0,compras=0;
  S.products.forEach(p=>{if((p.createdAt||0)<t)inv0+=(p.stock0||0)*(p.cost0??p.cost??0)});
  S.sales.forEach(s=>{if(s.ts<t)cash+=s.total});
  S.expenses.forEach(e=>{if(e.ts<t)cash-=e.amount});
  S.purchases.forEach(p=>{if(p.ts<t&&p.type!=="ajuste"){cash-=p.total;compras+=p.total}});
  const all=pnl(-Infinity,t),prev=pnl(-Infinity,periodStart),cur=pnl(periodStart,t);
  const inv=inv0+compras+all.aj-all.cogs;
  const assets=cash+inv+fa;
  const capital=oc+fa-L+inv0;
  const equity=capital+all.net-all.draws;
  return {cash,inv,fa,assets,L,capital,inv0,prevNet:prev.net,curNet:cur.net,draws:all.draws,equity,check:assets-(L+equity)};
}
function range(kind,off){
  const n=new Date();let a,b,label;
  if(kind==="semana"){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()),dow=(d.getDay()+6)%7;
    a=new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow+off*7);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+7);
    label="Semana del "+fdate(+a,{day:"numeric",month:"short"})+" al "+fdate(+b-864e5);}
  else if(kind==="mes"){a=new Date(n.getFullYear(),n.getMonth()+off,1);b=new Date(a.getFullYear(),a.getMonth()+1,1);
    label=a.toLocaleDateString("es-MX",{month:"long",year:"numeric"});label=label[0].toUpperCase()+label.slice(1);}
  else{a=new Date(n.getFullYear()+off,0,1);b=new Date(a.getFullYear()+1,0,1);label="Año "+a.getFullYear();}
  return {a:+a,b:+b,label};
}

// Logo principal: las montañas de «Lechuga & Co. · Ropa · Chamarras · Sudaderas». Insignia de trayectoria: el sello «Since 1990».
const MTN_PATH="M4 52 33 15 47 33 61 5 96 52M20 52l13-16 9 11 19-25 23 30",MTN_SNOW="M27 23l6-8 5 6M55 13l6-8 7 9";
function mountainSVG(w,c){c=c||{};const fg=c.fg||"#ffffff",snow=c.snow||BRAND.gold;
  return `<svg viewBox="0 0 100 60" width="${w}" height="${Math.round(w*.6)}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lechuga &amp; Co."><path d="${MTN_PATH}" fill="none" stroke="${fg}" stroke-width="4" stroke-linejoin="round"/><path d="${MTN_SNOW}" fill="none" stroke="${snow}" stroke-width="4" stroke-linejoin="round"/></svg>`}
// En la caja el logo va dentro de un círculo azul noche, como la foto de perfil de las redes.
function logoSVG(w){return `<span style="display:grid;place-items:center;width:${w}px;height:${w}px;border-radius:50%;background:${BRAND.night};box-shadow:0 0 0 2px ${BRAND.gold}">${mountainSVG(Math.round(w*.62))}</span>`}
function lockup(c){c=c||{};return `<span style="display:flex;align-items:center;gap:12px">${mountainSVG(54,c)}<span><span style="display:block;font:700 1.25rem 'Montserrat',sans-serif;letter-spacing:.14em;line-height:1">LECHUGA &amp; CO.</span><span style="display:block;font:600 .56rem 'Montserrat',sans-serif;letter-spacing:.3em;margin-top:6px;opacity:.8">ROPA · CHAMARRAS · SUDADERAS</span></span></span>`}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function avatarPNG(){
  await document.fonts.ready;const cv=document.createElement("canvas");cv.width=cv.height=1080;const x=cv.getContext("2d");
  x.fillStyle="#ffffff";x.fillRect(0,0,1080,1080);
  x.fillStyle=BRAND.night;x.beginPath();x.arc(540,540,520,0,7);x.fill();
  x.strokeStyle=BRAND.gold;x.lineWidth=14;x.beginPath();x.arc(540,540,500,0,7);x.stroke();
  x.save();x.translate(540-300,300);x.scale(6,6);x.lineJoin="round";x.lineWidth=4;
  x.strokeStyle="#ffffff";x.stroke(new Path2D(MTN_PATH));x.strokeStyle=BRAND.gold;x.stroke(new Path2D(MTN_SNOW));x.restore();
  x.fillStyle="#ffffff";x.textAlign="center";x.font=`700 92px "Montserrat", sans-serif`;
  if("letterSpacing" in x)x.letterSpacing="10px";x.fillText("LECHUGA & CO.",540,760);
  return new Promise(r=>cv.toBlob(r,"image/png"));
}

function offerFile(filename,data){
  const type=filename.endsWith(".json")?"application/json":filename.endsWith(".svg")?"image/svg+xml":"text/csv;charset=utf-8";
  const blob=data instanceof Blob?data:new Blob([filename.endsWith(".csv")?"﻿"+data:data],{type});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Descargando "+filename);
}

function bars(days){
  const W=640,H=150,P=24,max=Math.max(1,...days.map(d=>d.v)),bw=(W-P*2)/days.length;
  const nice=Math.pow(10,Math.floor(Math.log10(max))),top=Math.ceil(max/nice)*nice;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H+28}" width="100%" role="img" aria-label="Ventas de los últimos 14 días">`;
  [0,.5,1].forEach(f=>{const y=P+(H-P)*(1-f);s+=`<line class="grid" x1="${P+30}" x2="${W-P}" y1="${y}" y2="${y}"/><text x="${P+26}" y="${y+3}" text-anchor="end">${f?(top*f>=1000?(top*f/1000).toFixed(top*f%1000?1:0)+"k":Math.round(top*f)):"0"}</text>`});
  days.forEach((d,i)=>{const x=P+30+i*((W-P*2-30)/days.length),w=(W-P*2-30)/days.length-4,hh=(H-P)*d.v/top;
    s+=`<rect class="bar ${i===days.length-1?"now":""}" x="${x+2}" y="${H-hh}" width="${Math.max(1,w)}" height="${Math.max(0,hh)}" rx="2"><title>${d.l}: ${money(d.v)}</title></rect><text x="${x+2+w/2}" y="${H+16}" text-anchor="middle">${d.d}</text>`});
  return s+"</svg>";
}

function listCard(kind){

    return `<div class="line" style="grid-template-columns:minmax(0,1fr) auto"><div><b>${esc(n)}</b> <span class="small muted">${c} prenda${c===1?"":"s"}</span></div>

      <p class="small muted" style="margin:0">Al renombrar se cambian también todas sus prendas. Al quitar eliges a dónde se mueven.</p>`:`<p class="small muted" style="margin:0">Solo el administrador agrega, renombra o quita ${L.many.toLowerCase()}.</p>`}</div>`;

    <p class="small muted" style="margin:0;max-width:70ch">Descarga el archivo y súbelo en <b>Meta Commerce Manager → Catálogo → Orígenes de datos → Lista de datos</b>. Ese catálogo se conecta a tu cuenta de WhatsApp Business. Las fotos se toman de la página web, así que primero publica la tienda en <a href="#" data-act="tab" data-k="conexiones">Conexiones</a>.</p>

function vMovs(){
  const sub=UI.mov,now=new Date(),opts=activeProducts().map(p=>`<option value="${p.id}">${esc(p.name)}${p.size?" ("+esc(p.size)+")":""}</option>`).join("");
  const today=dayKey(Date.now());
  let form="",list="";
  if(sub==="gastos"){
    form=`<form class="card form" id="f-exp"><label>Fecha<input id="e-date" type="date" value="${today}" required></label><label>Categoría<select id="e-cat">${EXP_CATS.map(c=>`<option>${c}</option>`).join("")}<option>${DRAW}</option></select></label><label>Concepto<input id="e-con" placeholder="Renta de noviembre"></label><label>Monto<input id="e-amt" inputmode="decimal" required></label><label>Pagado con<select id="e-met">${METHODS.map(m=>`<option>${m}</option>`).join("")}</select></label><div style="align-self:end"><button class="primary" type="submit">Registrar gasto</button></div><p class="full small muted" style="margin:0">«${DRAW}» es dinero que tu papá saca para él: baja el efectivo y el capital, pero no cuenta como gasto del negocio.</p></form>`;
    const rows=S.expenses.slice().sort((a,b)=>b.ts-a.ts).slice(0,60);
    list=rows.length?`<div class="tbl"><table><thead><tr><th>Fecha</th><th>Categoría</th><th>Concepto</th><th>Pago</th><th class="r">Monto</th><th></th></tr></thead><tbody>${rows.map(e=>`<tr><td class="num">${fdate(e.ts)}</td><td>${e.category===DRAW?`<span class="pill warn">${DRAW}</span>`:esc(e.category)}</td><td>${esc(e.concept||"")}</td><td>${esc(e.method||"")}</td><td class="r">${money(e.amount)}</td><td>${delBtn("e",e.id)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Sin gastos registrados. Empieza con la renta, la luz o la nómina.</div>`;
  }else if(sub==="compras"){
    form=`<form class="card form" id="f-buy"><label class="full">Producto<select id="b-pid" required>${opts}</select></label><label>Fecha<input id="b-date" type="date" value="${today}"></label><label>Piezas<input id="b-qty" inputmode="numeric" required></label><label>Costo por pieza<input id="b-cost" inputmode="decimal" required></label><label>Proveedor<input id="b-sup"></label><label>Pagado con<select id="b-met">${METHODS.map(m=>`<option>${m}</option>`).join("")}</select></label><div style="align-self:end"><button class="primary" type="submit" ${opts?"":"disabled"}>Registrar compra</button></div><p class="full small muted" style="margin:0">Una compra sube las existencias y actualiza el costo del producto. No es gasto: el dinero se vuelve inventario y pasa a costo cuando se vende.</p></form>`;
    list=movList("compra");
  }else{
    form=`<form class="card form" id="f-adj"><label class="full">Producto<select id="a-pid" required>${opts}</select></label><label>Piezas (+ encontradas / − perdidas)<input id="a-qty" inputmode="numeric" placeholder="-1" required></label><label class="full">Motivo<input id="a-why" placeholder="Prenda dañada, conteo físico, regalo…"></label><div style="align-self:end"><button class="primary" type="submit" ${opts?"":"disabled"}>Registrar ajuste</button></div><p class="full small muted" style="margin:0">Las piezas perdidas o dañadas aparecen como «Mermas» en el estado de resultados.</p></form>`;
    list=movList("ajuste");
  }
  return `<div><div class="eyebrow">Salidas de dinero y mercancía</div><h2>Gastos y compras</h2></div>
  <div class="chips">${[["gastos","Gastos del negocio"],["compras","Compras de mercancía"],["ajustes","Ajustes de inventario"]].map(([k,l])=>`<button class="chip" data-act="mov" data-k="${k}" aria-pressed="${sub===k}">${l}</button>`).join("")}</div>${form}${list}`;
}
function delBtn(p,id){if(!isAdmin())return "";return UI.confirm===p+id?`<div class="row" style="flex-wrap:nowrap"><button class="tiny danger" data-act="del" data-k="${p+id}">Borrar</button><button class="tiny ghost" data-act="no">No</button></div>`:`<button class="tiny ghost danger" data-act="ask" data-k="${p+id}">Borrar</button>`}
function movList(type){
  const pn={};S.products.forEach(p=>pn[p.id]=p.name+(p.size?" ("+p.size+")":""));
  const rows=S.purchases.filter(p=>(p.type||"compra")===type).sort((a,b)=>b.ts-a.ts).slice(0,60);

function reportCSV(){
  const R=range(UI.period,UI.offset),c=pnl(R.a,R.b),B=balance(Math.min(R.b,Date.now()+1),R.a),f=n=>(n||0).toFixed(2);
  const rows=[[S.settings.name],["Estado de resultados",R.label],["Ventas brutas",f(c.bruto)],["Descuentos",f(-c.desc)],["Ventas netas",f(c.neto)],["Costo de lo vendido",f(-c.cogs)],["Mermas y ajustes",f(c.aj)],["Utilidad bruta",f(c.bruta)]];
  Object.entries(c.byCat).forEach(([k,v])=>rows.push(["Gasto: "+k,f(-v)]));
  rows.push(["Total gastos de operación",f(-c.opex)],["Utilidad neta",f(c.net)],[],["Balance general","al "+fdate(Math.min(R.b,Date.now())-1)],["Efectivo y bancos",f(B.cash)],["Inventario",f(B.inv)],["Mobiliario y equipo",f(B.fa)],["Total activo",f(B.assets)],["Pasivo",f(B.L)],["Capital inicial",f(B.capital)],["Utilidades anteriores",f(B.prevNet)],["Utilidad del periodo",f(B.curNet)],["Retiros del dueño",f(-B.draws)],["Total capital",f(B.equity)]);
  return toCSV(rows);
}

// Un modelo = misma prenda y temporada; adentro tiene colores (cada uno con su foto) y tallas (cada una es una prenda con precio, costo y existencias).
const ED={open:false,key:null,d:null,dirty:false,q:"",saving:false,ask:null,pc:0,ps:null,showArch:false};
const SWATCH={negro:"#111",blanco:"#fff","azul marino":"#1d2a4d",azul:"#2d5aa0",gris:"#8a8f96","gris oxford":"#5c6168","gris oscuro":"#4a4e54","gris claro":"#c9ccd0",olivo:"#4d5a32",khaki:"#c8b08a",vino:"#6d1f2b","café":"#6b4a33",cafe:"#6b4a33",camel:"#b98a56",taupe:"#9a8b7a","carbón":"#3a3d42",rojo:"#b8322b"};
const swatch=c=>SWATCH[String(c||"").toLowerCase().trim()]||"#ddd";
const modelKey=p=>[p.name,p.season].map(s=>String(s||"").toLowerCase().trim()).join("|");
const specsFrom=d=>String(d||"").split(" · ").filter(s=>s&&!/^Talla /.test(s));
const measFrom=d=>(String(d||"").split(" · ").find(s=>/^Talla /.test(s))||"").replace(/^Talla [^:]+:\s*/,"");
const SIZE_ORDER=["XS","CH","S","M","G","L","XL","XG","2XL","3XL","4XL","ÚNICA","UNICA"];
const sizeRank=s=>{const i=SIZE_ORDER.indexOf(String(s).toUpperCase());return i<0?50+(parseFloat(s)||0):i};

function edModels(){
  const g=new Map(),sm=stockMap();
  for(const p of S.products){
    const k=modelKey(p);if(!g.has(k))g.set(k,{key:k,name:p.name,season:p.season,category:p.category,photo:null,min:Infinity,max:0,colors:new Set(),stock:0,active:false});
    const m=g.get(k);m.colors.add(p.color||"");if(p.active!==false){m.active=true;m.stock+=Math.max(0,sm[p.id]||0);m.min=Math.min(m.min,num(p.price));m.max=Math.max(m.max,num(p.price))}
    if(!m.photo&&p.photo)m.photo=photoUrl(p);
  }
  return [...g.values()].sort((a,b)=>(b.active-a.active)||a.name.localeCompare(b.name));
}
function edLoad(key){
  const sm=stockMap(),used=new Set([...S.sales.flatMap(s=>(s.items||[]).map(i=>i.pid)),...S.purchases.map(x=>x.pid)]);
  const rows=S.products.filter(p=>modelKey(p)===key);if(!rows.length)return null;
  const f=rows.find(p=>p.active!==false)||rows[0],colors=[];
  for(const p of rows){let c=colors.find(x=>x.color===(p.color||""));if(!c)colors.push(c={color:p.color||"",photo:"",photoId:null,newPhoto:null,removePhoto:false,rows:[]});
    if(!c.photo&&p.photo){c.photo=photoUrl(p);c.photoId=p.id}
    const st=sm[p.id]||0;c.rows.push({id:p.id,isNew:false,sku:p.sku||"",size:p.size||"",price:p.price,cost:p.cost,stock:st,origStock:st,meas:measFrom(p.desc),active:p.active!==false,used:used.has(p.id)})}
  colors.forEach(c=>c.rows.sort((a,b)=>sizeRank(a.size)-sizeRank(b.size)));
  return {key,isNew:false,name:f.name,category:f.category||"",season:f.season||"",specs:specsFrom(f.desc).join("\n"),colors};
}

// Promoción de primera compra: la caja la calcula para mostrarla y el servidor la vuelve a validar al guardar.
const phoneKey=p=>{let d=String(p||"").replace(/\D/g,"");if(d.length===13&&d.startsWith("521"))d=d.slice(3);else if(d.length===12&&d.startsWith("52"))d=d.slice(2);return d};
const promoUsed=k=>S.sales.some(s=>s.promo==="primera"&&phoneKey(s.phone)===k);
function promoFor(phone,sub){
  const pr=S.settings.promo||{},k=phoneKey(phone);
  if(!pr.active||k.length!==10)return null;
  const c=(S.customers||[]).find(x=>x.phone===k);
  if(!c)return {ok:false,msg:`No está registrado. Regístralo en Clientes para darle ${pr.percent}% en su primera compra.`};
  if(pr.end&&dayKey(Date.now())>pr.end)return {ok:false,c,msg:`La promoción venció el ${fdate(new Date(pr.end+"T12:00"))}.`};
  if(promoUsed(k))return {ok:false,c,msg:`${c.name} ya usó su descuento de primera compra.`};
  if(sub<num(pr.minimum))return {ok:false,c,msg:`${c.name} tiene ${pr.percent}% en su primera compra desde ${money(pr.minimum)}. Le faltan ${money(pr.minimum-sub)}.`};
  return {ok:true,c,pct:num(pr.percent),disc:Math.round(sub*num(pr.percent))/100,msg:`Primera compra de ${c.name}: ${pr.percent}% de descuento`};
}
function cartTotals(){
  const sub=UI.cart.reduce((x,i)=>x+i.qty*i.price,0),disc=Math.min(sub,Math.max(0,num(UI.discount)));
  const promo=UI.cart.length?promoFor(UI.phone,sub):null,promoDisc=promo&&promo.ok&&UI.usePromo!==false?promo.disc:0;
  return {sub,disc,promo,promoDisc,tot:Math.max(0,Math.round((sub-disc-promoDisc)*100)/100)};
}
async function checkout(){
  if(!UI.cart.length)return;
  const {sub,promo,promoDisc,tot}=cartTotals(),ts=Date.now();
  const sale={ts,items:UI.cart.map(i=>({...i})),subtotal:sub,total:tot,method:$("#pos-method").value,channel:$("#pos-channel").value,
    customer:$("#pos-cust").value.trim()||(promo&&promo.c?promo.c.name:""),phone:UI.phone||"",promo:promoDisc?"primera":""};
  const btn=document.querySelector('[data-act="checkout"]');if(btn)btn.disabled=true;
  try{await put("sales",uid(),sale);UI.lastSale=sale;UI.cart=[];UI.discount=0;UI.phone="";UI.usePromo=true;toast("Venta registrada: "+money(sale.total));render()}catch{if(btn)btn.disabled=false}
}

    case "list-adopt":{const L=LISTS[k],list=listOf(k);const names=[...new Set(S.products.filter(p=>p.active!==false&&p[L.field]&&!list.includes(p[L.field])).map(p=>p[L.field]))];
      for(const name of names)if(!(await listOp({kind:k,action:"add",name})))break;break}
    case "del":{const col=k[0]==="e"?"expenses":"purchases";UI.confirm=null;await del(col,k.slice(1));toast("Registro borrado");break}
    case "mov":UI.mov=k;UI.confirm=null;render();break;
    case "period":UI.period=k;UI.offset=0;render();break;
    case "off":UI.offset=Math.min(0,UI.offset+Number(k));render();break;
    case "export-cat":offerFile("catalogo-whatsapp.csv",catalogCSV(),"Catálogo para WhatsApp Business");break;
    case "show-cat":showText("Catálogo para WhatsApp Business",catalogCSV());break;
    case "export-rep":offerFile("estados-financieros-"+UI.period+".csv",reportCSV(),"Estados financieros");break;
    case "export-sales":{const rows=[["fecha","hora","folio","producto","talla","piezas","precio","costo","total_ticket","pago","canal","cliente"]];
      S.sales.slice().sort((a,b)=>a.ts-b.ts).forEach(s=>(s.items||[]).forEach(i=>rows.push([dayKey(s.ts),ftime(s.ts),folio(s.ts),i.name,i.size,i.qty,i.price,i.cost,s.total,s.method,s.channel,s.customer])));
      offerFile("ventas.csv",toCSV(rows),"Ventas");break}
    case "backup":offerFile("respaldo-tienda.json",JSON.stringify({settings:S.settings,products:S.products,sales:S.sales,expenses:S.expenses,purchases:S.purchases},null,1),"Respaldo");break;
    case "dl-logo":offerFile("lechuga-co-logo.svg",mountainSVG(600,{fg:BRAND.night}));break;
    case "dl-sello":{try{const b=await (await fetch("../marca/sello.png")).blob();offerFile("lechuga-co-sello.png",b)}catch{toast("No se pudo descargar el sello")}break}
    case "dl-avatar":{const blob=await avatarPNG();if(blob)offerFile("lechuga-co-perfil.png",blob);break}
    case "del-examples":{UI.confirm=null;try{await api("DELETE","/api/ejemplos");await load();toast("Datos de ejemplo borrados")}catch(e){toast(e.message)}break}
    case "logout":{try{await api("POST","/api/logout")}catch{}logout();break}
    case "del-photo":{try{await del("photos",k);toast("Foto quitada")}catch{}break}
    case "publish":{S.pub="…";render();try{const r=await api("POST","/api/publicar");S.pub=r.message}catch(e){S.pub=e.message}render();break}
    case "pw":UI.pwFor=Number(k);render();break;
    case "pw-cancel":UI.pwFor=null;render();break;
    case "save-pw":{const pw=$("#u-newpw").value;if(pw.length<8){toast("Mínimo 8 caracteres");break}
      try{await api("PUT","/api/usuarios/"+k,{password:pw});UI.pwFor=null;toast("Contraseña cambiada");render()}catch(e){toast(e.message)}break}
    case "toggle-user":{const u=(S.users||[]).find(x=>x.id===Number(k));if(!u)break;
      try{await api("PUT","/api/usuarios/"+k,{active:!u.active});await loadUsers();toast(u.active?"Usuario desactivado":"Usuario activado")}catch(e){toast(e.message)}break}
    case "close-ov":$("#overlay").hidden=true;break;
    case "copy-ov":copy($("#ov-text").value,$("#ov-text"));break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="pos-q"){UI.q=e.target.value;render()}
  if(e.target.id==="pos-desc"){UI.discount=e.target.value;render()}
  if(e.target.id==="pos-phone"){UI.phone=e.target.value;render()}
  if(e.target.id==="pos-promo"){UI.usePromo=e.target.checked;render()}
  if(e.target.id==="cl-q"){UI.clq=e.target.value;render()}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target,v=id=>(document.getElementById(id)||{}).value||"",btn=f.querySelector('[type="submit"]');
  const dateTs=id=>{const d=v(id);if(!d)return Date.now();const [y,m,dd]=d.split("-").map(Number);const now=new Date();return d===dayKey(Date.now())?Date.now():+new Date(y,m-1,dd,12,0,0)};
  if(btn)btn.disabled=true;
  try{
    if(f.id==="f-first"){
      if(v("fr-pw")!==v("fr-pw2")){S.loginMsg="Las contraseñas no coinciden";lastKey="";render();return}
      try{const r=await api("POST","/api/primera-cuenta",{name:v("fr-name").trim(),username:v("fr-user").trim(),password:v("fr-pw")});TOKEN=r.token;try{localStorage.setItem("lc-token",TOKEN)}catch{}
        S.me=r.me;S.firstRun=false;S.loginMsg="";lastKey="";await load();toast("¡Bienvenido! Tu cuenta de administrador quedó creada.")}catch(err){S.loginMsg=err.message;lastKey="";render()}}
    if(f.id==="f-login"){
      try{const r=await api("POST","/api/login",{username:v("l-user").trim(),password:v("l-pw")});TOKEN=r.token;try{localStorage.setItem("lc-token",TOKEN)}catch{}
        S.me=r.me;S.loginMsg="";lastKey="";await load()}catch(err){S.loginMsg=err.message;lastKey="";render()}}
    if(f.id.startsWith("f-list-")){const kind=f.id.slice(7),name=v("nl-"+kind).trim();if(!name)return;
      if(await listOp({kind,action:"add",name})){const el=$("#nl-"+kind);if(el)el.value="";toast("Agregada")}}
    if(f.id==="f-cust"){
      try{await api("POST","/api/clientes",{name:v("c-name").trim(),phone:v("c-phone"),email:v("c-mail").trim()});f.reset();lastKey="";await load();toast("Cliente registrado")}catch(err){toast(err.message)}}
    if(f.id==="f-user"){
      try{await api("POST","/api/usuarios",{name:v("u-name").trim(),username:v("u-user").trim(),password:v("u-pw"),role:v("u-role")});f.reset();toast("Usuario creado");await loadUsers()}catch(err){toast(err.message)}}
    if(f.id==="f-prod"){const old=UI.editing==="new"?null:S.products.find(x=>x.id===UI.editing),id=old?old.id:uid();
      const data={...(old?strip(old):{}),name:v("p-name").trim(),sku:v("p-sku").trim(),category:v("p-cat").trim(),season:v("p-season").trim(),size:v("p-size").trim(),color:v("p-color").trim(),price:num(v("p-price")),cost:num(v("p-cost")),desc:v("p-desc").trim(),active:true};
      if(!old)data.stock0=Math.round(num(v("p-stock")));
      const file=($("#p-photo")||{}).files?.[0];
      await put("products",id,data);
      if(file){const jpg=await resizeImage(file);await put("photos",id,{data:jpg})}
      UI.editing=null;lastKey="";toast("Producto guardado");}
    if(f.id==="f-exp"){const amt=num(v("e-amt"));if(amt<=0){toast("Escribe un monto mayor a cero");return}
      await put("expenses",uid(),{ts:dateTs("e-date"),category:v("e-cat"),concept:v("e-con").trim(),amount:amt,method:v("e-met")});lastKey="";toast("Gasto registrado");}
    if(f.id==="f-buy"){const p=S.products.find(x=>x.id===v("b-pid")),q=Math.round(num(v("b-qty"))),c=num(v("b-cost"));if(!p||q<=0){toast("Revisa el producto y las piezas");return}
      await put("purchases",uid(),{type:"compra",ts:dateTs("b-date"),pid:p.id,qty:q,unitCost:c,total:q*c,supplier:v("b-sup").trim(),method:v("b-met")});lastKey="";toast("Compra registrada: +"+q+" pzas");}
    if(f.id==="f-adj"){const p=S.products.find(x=>x.id===v("a-pid")),q=Math.round(num(v("a-qty")));if(!p||!q){toast("Escribe cuántas piezas (+ o −)");return}
      await put("purchases",uid(),{type:"ajuste",ts:Date.now(),pid:p.id,qty:q,unitCost:num(p.cost),total:q*num(p.cost),reason:v("a-why").trim()});lastKey="";toast("Ajuste registrado");}
    if(f.id==="f-set"){await put("config","business",{...S.settings,name:v("s-name").trim()||DEFAULTS.name,tagline:v("s-tag").trim(),phone:v("s-phone").trim(),currency:v("s-cur"),openingCash:num(v("s-cash")),fixedAssets:num(v("s-fa")),liabilities:num(v("s-liab")),storeUrl:v("s-url").trim(),city:v("s-city").trim(),
      promo:{active:$("#s-pr-on").checked,title:v("s-pr-title").trim(),percent:num(v("s-pr-pct")),minimum:num(v("s-pr-min")),end:v("s-pr-end")}});lastKey="";toast("Ajustes guardados. Publica la página web para que la promoción se actualice ahí.");}
  }catch{}finally{if(btn)btn.disabled=false;schedule()}
});
boot();
</script>
</body>
