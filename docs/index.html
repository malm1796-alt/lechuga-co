<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101923">
<title>Lechuga &amp; Co. · Ropa, chamarras y sudaderas</title>
<meta name="description" content="Chamarras, sudaderas, camisas de franela y chalecos. Colección de invierno. Pide por WhatsApp.">
<link rel="icon" href="marca/sello.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Tienda Lechuga & Co.: encabezado azul noche, portada de invierno, acentos dorados. Un solo look claro con bandas oscuras (como el diseño de referencia). */
:root{
  --night:#101923; --night-2:#18242f; --gold:#d5a64b; --gold-dk:#b88a33; --cream:#f6f4ef; --paper:#ffffff;
  --ink:#101923; --muted:#68717a; --line:#e7e4dd; --wa:#1f7a3f; --good:#1d7f55; --bad:#b83434;
  --f-title:"Montserrat","Segoe UI",system-ui,sans-serif; --f-body:"Poppins","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--cream);color:var(--ink);font:400 15px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lab{font:700 .72rem var(--f-title);letter-spacing:.2em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 26px;border-radius:4px;background:var(--gold);color:var(--night);font:800 .8rem var(--f-title);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.btn:hover{background:#e0b65f}
.btn.line{background:transparent;color:var(--gold);border:1.5px solid var(--gold)}
.btn.line:hover{background:rgba(213,166,75,.1)}
.btn.dark{background:var(--night);color:#fff}
.btn.wa{background:var(--wa);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mtn{width:58px;height:auto;flex:none}
/* barra superior y encabezado */
.topbar{background:#0b121a;color:#e9ecef;font-size:.82rem}
.topbar .wrap{display:flex;justify-content:space-between;gap:16px;padding-block:8px;align-items:center}
.topbar b{color:var(--gold);font-weight:600}
.topbar .mid{text-align:center;flex:1}
@media (max-width:760px){.topbar .side{display:none}}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--night);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
header.site .wrap{display:flex;align-items:center;gap:28px;padding-block:14px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;flex:none}
.brand strong{display:block;font:700 1.3rem var(--f-title);letter-spacing:.14em;line-height:1}
.brand small{display:block;font:600 .56rem var(--f-title);letter-spacing:.3em;margin-top:6px;color:#cfd6dd}
nav.main{display:flex;gap:26px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{flex:none;text-decoration:none;font:500 .92rem var(--f-body);padding-block:6px;border-bottom:2px solid transparent;color:#e9ecef}
nav.main a:hover,nav.main a[aria-current]{border-color:var(--gold);color:#fff}
.search{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 14px;width:min(260px,30vw)}
.search input{background:transparent;border:0;color:#fff;font:inherit;font-size:.88rem;width:100%;min-width:0;outline:none}
.search input::placeholder{color:#aeb7c0}
.cartbtn{position:relative;flex:none;display:grid;place-items:center;width:40px;height:40px}
.cartbtn .n{position:absolute;top:-2px;right:-4px;background:var(--gold);color:var(--night);border-radius:999px;font:800 .66rem var(--f-title);min-width:18px;height:18px;display:grid;place-items:center;padding-inline:4px}
@media (max-width:980px){header.site .wrap{flex-wrap:wrap;gap:12px 18px}.search{order:3;width:100%}nav.main{order:4;flex-basis:100%}.brand strong{font-size:1.05rem}.mtn{width:46px}}
/* portada */
.hero{position:relative;color:#fff;background:var(--night) center/cover no-repeat;min-height:min(78vh,620px);display:grid;align-content:end}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(16,25,35,.15) 0%,rgba(16,25,35,.35) 45%,rgba(16,25,35,.88) 100%)}
@media (max-width:760px){.hero::before{background:linear-gradient(180deg,rgba(16,25,35,.2) 0%,rgba(16,25,35,.92) 70%)}}
.hero .wrap{position:relative;width:100%;display:grid;justify-items:end;padding-block:64px 28px}
.hero .copy{max-width:520px;display:grid;gap:16px}
.hero .k{color:var(--gold);letter-spacing:.42em;font-style:italic}
.hero h1{margin:0;font:italic 800 clamp(2.8rem,7vw,5.2rem)/.92 var(--f-title);letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
.hero h1 em{color:var(--gold)}
.hero p{margin:0;font-size:1.05rem;color:#e9ecef}
@media (max-width:760px){.hero .wrap{justify-items:start}}
.trust{position:relative;background:rgba(10,16,23,.82);border-top:1px solid rgba(255,255,255,.08)}
.trust .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-block:14px}
.trust div{display:flex;gap:12px;align-items:center;font-size:.8rem;color:#cfd6dd;min-width:0}
.trust b{display:block;color:#fff;font:600 .88rem var(--f-body)}
.trust svg{flex:none;width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.5}
@media (max-width:900px){.trust .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* banner de promoción */
.promo{margin-block:28px 8px;display:grid;grid-template-columns:minmax(0,1.25fr) auto minmax(0,1fr) auto;align-items:center;gap:24px;background:var(--night);color:#fff;border-radius:6px;padding:20px 28px;position:relative;overflow:hidden}
.promo h2{margin:0;font:700 1.45rem var(--f-title);letter-spacing:.06em;text-transform:uppercase}
.promo .sub{color:#cfd6dd}
.promo .pct{background:var(--gold);color:var(--night);clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);padding:14px 46px;font:italic 800 2.6rem/1 var(--f-title);display:flex;align-items:center;gap:10px;white-space:nowrap}
.promo .pct small{font:italic 800 .9rem/1.1 var(--f-title);text-transform:uppercase}
.promo ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:.88rem}
.promo li::before{content:"✓";color:var(--gold);margin-right:10px;font-weight:700}
@media (max-width:1000px){.promo{grid-template-columns:minmax(0,1fr)}.promo .pct{justify-self:start}}
/* secciones */
.sect{padding-block:40px 8px}
.sect-h{display:flex;align-items:center;gap:22px;margin-bottom:22px}
.sect-h h2{margin:0;font:700 1rem var(--f-title);letter-spacing:.24em;text-transform:uppercase}
.sect-h::after{content:"";height:3px;width:110px;background:linear-gradient(90deg,var(--gold),transparent)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media (max-width:900px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:16/10;max-width:100%;background:var(--night);color:#fff;text-align:left;display:block}
.cat img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,25,35,0) 30%,rgba(16,25,35,.85))}
.cat .t{position:absolute;left:22px;right:22px;bottom:18px;z-index:1;display:flex;justify-content:space-between;align-items:end;gap:10px}
.cat b{display:block;font:700 1.25rem var(--f-title);letter-spacing:.08em;text-transform:uppercase;line-height:1.1}
.cat span{font-size:.85rem;color:#dfe4e8}
.cat .noph{width:100%;height:100%;display:grid;place-items:center}
@media (prefers-reduced-motion:no-preference){.cat:hover img{transform:scale(1.05)}}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;align-items:center}
.chip{border:1px solid var(--night);border-radius:999px;padding:7px 16px;font:600 .74rem var(--f-title);letter-spacing:.1em;text-transform:uppercase;background:var(--paper)}
.chip[aria-pressed="true"]{background:var(--night);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 18px;padding-bottom:30px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 10px}}
.card{display:grid;gap:10px;text-align:left;position:relative;min-width:0;background:var(--paper);border-radius:6px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.ph{aspect-ratio:4/5;max-width:100%;background:#eeece6;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
@media (prefers-reduced-motion:no-preference){.ph img{transition:transform .6s}.card:hover .ph img{transform:scale(1.035)}}
.noimg{width:100%;height:100%;display:grid;place-items:center;align-content:center;gap:12px;background:var(--night);color:#fff;padding:16px;text-align:center}
.noimg span{font:700 .8rem var(--f-title);letter-spacing:.1em;text-transform:uppercase}
.info{padding:2px 14px 16px;display:grid;gap:4px}
.info .n{font:600 .9rem var(--f-title);line-height:1.3}
.info .p{font-weight:600;color:var(--gold-dk)}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid #c9c4b8;display:block}
.flag{position:absolute;top:10px;left:10px;background:var(--gold);color:var(--night);padding:3px 9px;font:800 .6rem var(--f-title);letter-spacing:.14em;text-transform:uppercase;border-radius:2px}
.empty{padding-block:60px;text-align:center;color:var(--muted)}
/* nosotros y contacto */
.about{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:center;background:var(--paper);border-radius:6px;padding:34px}
.about img{width:170px;height:170px;border-radius:50%}
.about p{margin:0 0 10px;max-width:68ch}
@media (max-width:760px){.about{grid-template-columns:minmax(0,1fr);justify-items:start}}
.contact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.contact > div{background:var(--paper);border-radius:6px;padding:22px;display:grid;gap:6px;align-content:start}
.contact b{font:700 .9rem var(--f-title);letter-spacing:.08em;text-transform:uppercase}
@media (max-width:760px){.contact{grid-template-columns:minmax(0,1fr)}}
footer{background:var(--night);color:#cfd6dd;margin-top:46px}
footer .wrap{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,1fr));gap:28px;padding-block:40px}
footer h4{margin:0 0 8px;color:#fff;font:700 .78rem var(--f-title);letter-spacing:.18em;text-transform:uppercase}
footer a{color:#cfd6dd;text-decoration:none}
footer a:hover{color:var(--gold)}
footer .legal{border-top:1px solid rgba(255,255,255,.1);padding-block:16px;font-size:.78rem}
@media (max-width:760px){footer .wrap{grid-template-columns:minmax(0,1fr)}}
/* ficha, cesta y registro */
.shade{position:fixed;inset:0;background:rgba(8,12,18,.55);z-index:30}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);z-index:31;overflow:auto;display:grid;gap:16px;align-content:start;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 22px}
.sheet h2{margin:0;font:700 1.4rem var(--f-title);line-height:1.15}
.sheet .x{justify-self:end;font:700 .72rem var(--f-title);letter-spacing:.16em;text-transform:uppercase}
.price{font:700 1.3rem var(--f-title);color:var(--gold-dk)}
.note{font-size:.82rem;color:var(--muted)}
.specs{margin:0;padding-left:18px;font-size:.88rem;display:grid;gap:3px}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size{min-width:58px;padding:11px 12px;border:1.5px solid var(--night);border-radius:4px;font:700 .82rem var(--f-title)}
.size[aria-pressed="true"]{background:var(--night);color:#fff}
.size:disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.line{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.line .ph{width:72px;border-radius:4px}
.line .noimg span{display:none}
.qty{display:flex;align-items:center;gap:10px;margin-top:6px}
.qty button{width:28px;height:28px;border:1px solid var(--line);border-radius:4px}
.row{display:flex;justify-content:space-between;gap:10px}
.tot{font:800 1.15rem var(--f-title);text-transform:uppercase}
.box{border:1.5px dashed var(--gold);border-radius:6px;padding:12px 14px;font-size:.88rem;background:#fbf6ea;display:grid;gap:6px}
.box label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.box input{margin-top:4px}
form.reg{display:grid;gap:12px}
form.reg label{display:grid;gap:4px;font:600 .8rem var(--f-title)}
form.reg input[type=text],form.reg input[type=tel],form.reg input[type=email]{font:inherit;padding:11px 12px;border:1px solid #cfcac0;border-radius:4px;background:#fff;width:100%;min-width:0}
form.reg .ok{display:flex;gap:10px;align-items:flex-start;font:400 .82rem var(--f-body)}
.msg{border-radius:6px;padding:12px 14px;font-size:.9rem}
.msg.good{background:#e3f3ea;color:var(--good)}
.msg.bad{background:#f8e3e3;color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--night);color:#fff;padding:10px 18px;border-radius:999px;font-weight:500;font-size:.9rem;z-index:40;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div id="app"><div class="empty lab">Cargando colección…</div></div>
<div id="toast" class="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MTN=`<svg class="mtn" viewBox="0 0 100 60" aria-hidden="true"><path d="M4 52 33 15 47 33 61 5 96 52M20 52l13-16 9 11 19-25 23 30" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M27 23l6-8 5 6M55 13l6-8 7 9" fill="none" stroke="#d5a64b" stroke-width="4" stroke-linejoin="round"/></svg>`;
const ICON={truck:'<path d="M2 7h12v9H2zM14 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',medal:'<circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',bag:'<path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 016 0v2"/>'};
const icon=(k,w=24)=>`<svg viewBox="0 0 24 24" width="${w}" height="${w}" aria-hidden="true" style="stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round">${ICON[k]}</svg>`;
// Fotos de categoría del kit de marca, para las categorías que aún no tienen foto propia.
const CAT_IMG={"sudaderas":"marca/cat-sudaderas.webp","sueteres":"marca/cat-sueteres.webp","sobrecamisas":"marca/cat-sobrecamisas.webp","camisas de franela":"marca/cat-sobrecamisas.webp"};
const CAT_SUB={"chamarras":"Protección y estilo","sudaderas":"Estilo casual","camisas de franela":"Versatilidad diaria","sobrecamisas":"Versatilidad diaria","chalecos":"Ligeros y prácticos","chamarras de piel":"Piel de borrego de León","sueteres":"Comodidad y calidez"};
const COLORS={negro:"#111",blanco:"#fff","azul marino":"#1d2a4d",azul:"#2d5aa0",gris:"#8a8f96","gris oxford":"#5c6168","gris oscuro":"#4a4e54","gris claro":"#c9ccd0",olivo:"#4d5a32",khaki:"#c8b08a",vino:"#6d1f2b",cafe:"#6b4a33",camel:"#b98a56",taupe:"#9a8b7a",carbon:"#3a3d42",rojo:"#b8322b"};
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
let C={settings:{name:"Lechuga & Co.",tagline:"",phone:"",currency:"MXN",city:"",promo:null},items:[]};
const U={cat:"",season:"",q:"",open:null,size:null,bag:[],showBag:false,reg:false,priv:false,regMsg:null,firstBuy:false};
let API="";
try{U.bag=JSON.parse(localStorage.getItem("lc-cesta")||"[]");U.firstBuy=localStorage.getItem("lc-registrado")==="1"}catch{}
const saveBag=()=>{try{localStorage.setItem("lc-cesta",JSON.stringify(U.bag))}catch{}};
const money=n=>{try{return new Intl.NumberFormat("es-MX",{style:"currency",currency:C.settings.currency||"MXN",maximumFractionDigits:0}).format(n||0)}catch{return "$"+Math.round(n||0)}};
const phoneDigits=p=>{let d=String(p||"").replace(/\D/g,"");if(d.length===10)d="52"+d;return d};
const wa=t=>C.settings.phone?`https://wa.me/${phoneDigits(C.settings.phone)}?text=${encodeURIComponent(t)}`:"";
const fdate=s=>new Date(s+"T12:00").toLocaleDateString("es-MX",{day:"numeric",month:"long"});
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3000)}

// Una ficha por modelo (como en las tiendas de cadena); adentro se elige color y talla.
function groups(){
  const g=new Map();
  for(const it of C.items){
    const k=[it.name,it.season].map(norm).join("|");
    if(!g.has(k))g.set(k,{key:"m"+g.size,name:it.name,season:it.season,category:it.category,desc:it.desc,price:it.price,colors:[],stock:0});
    const m=g.get(k);let c=m.colors.find(x=>norm(x.color)===norm(it.color));
    if(!c)m.colors.push(c={color:it.color,photo:it.photo,sizes:[],stock:0});
    c.sizes.push({id:it.id,size:it.size||"Única",stock:it.stock,desc:it.desc});c.stock+=it.stock;m.stock+=it.stock;
    if(!c.photo&&it.photo)c.photo=it.photo;m.price=Math.min(m.price,it.price);
  }
  return [...g.values()].map(m=>{m.colors=m.colors.filter(c=>c.stock>0);m.photo=(m.colors.find(c=>c.photo)||{}).photo||"";return m}).filter(m=>m.stock>0);
}
const colorOf=m=>m.colors.find(c=>c.color===U.color)||m.colors[0];
const pic=(m,alt=true)=>m.photo?`<img src="${esc(m.photo)}" alt="${alt?esc(m.name+(m.color?", "+m.color:"")):""}" loading="lazy">`:`<div class="noimg">${MTN}<span>${esc(m.name)}</span></div>`;
// La descripción trae «característica · característica · Talla M: largo 71 cm, pecho 122 cm».
const specsOf=d=>String(d||"").split(" · ").filter(s=>s&&!/^Talla /.test(s));
const measureOf=d=>(String(d||"").split(" · ").find(s=>/^Talla /.test(s))||"").replace(/^Talla [^:]+:\s*/,"");
const promo=()=>{const p=C.settings.promo;if(!p)return null;if(p.end&&new Date().toISOString().slice(0,10)>p.end)return null;return p};

function render(){
  const all=groups(),st=C.settings,pr=promo(),n=U.bag.reduce((a,b)=>a+b.qty,0);
  const seasons=[...new Set(all.map(m=>m.season).filter(Boolean))];
  const featured=seasons.filter(s=>!/todo el a/i.test(s))[0]||"Invierno";
  const q=norm(U.q);
  const list=all.filter(m=>(!U.cat||m.category===U.cat)&&(!U.season||m.season===U.season)&&(!q||norm([m.name,m.category,...m.colors.map(c=>c.color)].join(" ")).includes(q)));
  const cats=[...new Set(all.map(m=>m.category).filter(Boolean))];
  const order=(st.categories||[]);cats.sort((a,b)=>(order.indexOf(a)+1||99)-(order.indexOf(b)+1||99));
  let h=`<div class="topbar"><div class="wrap"><span class="side">${icon("truck",16)} Envíos a todo México</span>
    <span class="mid">${pr?`<b>${esc(pr.title)}:</b> ${pr.percent}% en tu primera compra al registrarte`:esc(st.tagline||"")}</span>
    <span class="side">${st.phone?`${icon("chat",16)} WhatsApp ${esc(st.phone)}`:""}</span></div></div>
  <header class="site"><div class="wrap"><a class="brand" href="#inicio">${MTN}<span><strong>LECHUGA &amp; CO.</strong><small>ROPA · CHAMARRAS · SUDADERAS</small></span></a>
    <nav class="main" aria-label="Secciones"><a href="#coleccion" data-act="cat" data-k="" ${!U.cat?'aria-current="page"':""}>Colección ${esc(featured.replace(/\s*\d{4}$/,""))}</a>${cats.map(c=>`<a href="#coleccion" data-act="cat" data-k="${esc(c)}" ${U.cat===c?'aria-current="page"':""}>${esc(c)}</a>`).join("")}${pr?'<a href="#promocion">Promociones</a>':""}<a href="#nosotros">Nosotros</a><a href="#contacto">Contacto</a></nav>
    <label class="search"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="stroke:#fff;fill:none;stroke-width:2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Buscar productos…" value="${esc(U.q)}" aria-label="Buscar productos"></label>
    <button class="cartbtn" data-act="bag" aria-label="Cesta, ${n} piezas">${icon("bag",26)}<span class="n">${n}</span></button></div></header>
  <section class="hero" id="inicio" style="background-image:url('marca/portada-invierno.webp')"><div class="wrap"><div class="copy">
    <div class="lab k">Colección ${esc(featured)}</div><h1>El frío,<br><em>con estilo</em></h1>
    <p>Chamarras, sudaderas, camisas de franela y chalecos pensados para la temporada.</p>
    <div><a class="btn" href="#coleccion">${icon("bag",18)} Descubrir colección →</a></div></div></div>
    <div class="trust"><div class="wrap">
      <div>${icon("truck",30)}<span><b>Envíos a todo México</b>Rápidos y seguros</span></div>
      <div>${icon("shield",30)}<span><b>Calidad garantizada</b>Prendas de alta durabilidad</span></div>
      <div>${icon("medal",30)}<span><b>Desde 1990</b>American Clothing</span></div>
      <div>${icon("chat",30)}<span><b>Atención personalizada</b>Contáctanos por WhatsApp</span></div></div></div></section>
  <main class="wrap">
    ${pr?`<section class="promo" id="promocion"><div><h2>❄ ${esc(pr.title)}</h2><div class="sub">Prepárate para la temporada de frío.</div></div>
      <div class="pct">${pr.percent}%<small>de<br>descuento</small></div>
      <ul><li>En tu primera compra al registrarte</li><li>Compra mínima de ${money(pr.minimum)} MXN</li>${pr.end?`<li>Válido hasta el ${fdate(pr.end)}</li>`:""}</ul>
      <button class="btn line" data-act="reg">${U.firstBuy?"Ya estás registrado ✓":"Registrarme ahora →"}</button></section>`:""}
    ${cats.length?`<section class="sect"><div class="sect-h"><h2>Compra por categoría</h2></div><div class="cats">${cats.slice(0,4).map(c=>{
      const m=all.find(x=>x.category===c&&x.photo),src=m?m.photo:CAT_IMG[norm(c)];
      return `<a class="cat" href="#coleccion" data-act="cat" data-k="${esc(c)}">${src?`<img src="${esc(src)}" alt="" loading="lazy">`:`<div class="noph">${MTN}</div>`}<span class="t"><span><b>${esc(c)}</b><span>${esc(CAT_SUB[norm(c)]||"Ver colección")}</span></span><span aria-hidden="true">→</span></span></a>`}).join("")}</div></section>`:""}
    <section class="sect" id="coleccion"><div class="sect-h"><h2>${esc(U.cat||"Colección "+featured)}</h2></div>
      ${seasons.length>1?`<div class="filters"><button class="chip" data-act="season" data-k="" aria-pressed="${!U.season}">Todas</button>${seasons.map(s=>`<button class="chip" data-act="season" data-k="${esc(s)}" aria-pressed="${U.season===s}">${esc(s)}</button>`).join("")}${U.cat?`<button class="chip" data-act="cat" data-k="">Quitar filtro: ${esc(U.cat)} ✕</button>`:""}</div>`:U.cat?`<div class="filters"><button class="chip" data-act="cat" data-k="">Quitar filtro: ${esc(U.cat)} ✕</button></div>`:""}
      ${list.length?`<div class="grid">${list.map(m=>`<button class="card" id="p-${esc(m.colors[0].sizes[0].id)}" data-act="open" data-k="${m.key}"><div class="ph">${pic(m)}</div>${m.stock<=2?'<span class="flag">Últimas piezas</span>':""}
        <div class="info"><span class="n">${esc(m.name)}</span><span class="note">${m.colors.length>1?m.colors.length+" colores":esc(m.colors[0].color||"")}</span><span class="p">${money(m.price)}</span>${m.colors.length>1?`<span class="dots">${m.colors.map(x=>`<i style="background:${COLORS[norm(x.color)]||"#ddd"}" title="${esc(x.color)}"></i>`).join("")}</span>`:""}</div></button>`).join("")}</div>`
        :`<div class="empty lab">${C.items.length?"No hay piezas que coincidan.":"La colección llega muy pronto."}</div>`}</section>
    <section class="sect" id="nosotros"><div class="sect-h"><h2>Nosotros</h2></div><div class="about"><img src="marca/sello.png" alt="Lechuga &amp; Co., desde 1990, American Clothing">
      <div><p><b>Lechuga &amp; Co.</b> ofrece chamarras, sudaderas y chalecos diseñados para brindar estilo, comodidad y calidad durante todo el año.</p>
      <p>Nuestra colección va desde las prendas Original Deluxe, ligeras y elegantes, hasta sudaderas y chamarras sencillas para el uso diario. Destacan nuestras chamarras de piel de borrego hechas en León, Guanajuato.</p>
      <p>Vendemos al menudeo y también atendemos a empresas y al sector industrial, con prendas adaptadas a cada necesidad.</p></div></div></section>
    <section class="sect" id="contacto"><div class="sect-h"><h2>Contacto</h2></div><div class="contact">
      <div><b>WhatsApp</b>${st.phone?`<span style="user-select:all">${esc(st.phone)}</span><a class="btn wa" style="justify-self:start;margin-top:6px" href="${esc(wa(`Hola ${st.name} 👋 Tengo una pregunta.`))}" target="_blank" rel="noopener">Escríbenos</a>`:'<span class="note">Pronto publicaremos nuestro número.</span>'}</div>
      <div><b>Empresas</b><span class="note">Uniformes y pedidos por caja para empresas e industria. Pide tu cotización por WhatsApp.</span></div>
      <div><b>Dónde estamos</b><span class="note">${esc(st.city||"México")}. Envíos a todo el país.</span></div></div></section>
  </main>
  <footer><div class="wrap"><div><a class="brand" href="#inicio">${MTN}<span><strong>LECHUGA &amp; CO.</strong><small>ROPA · CHAMARRAS · SUDADERAS</small></span></a><p style="margin-top:14px">Ropa y básicos de temporada desde 1990.<br>${esc(st.city||"")}</p></div>
    <div><h4>Explora</h4><a href="#coleccion">Colección ${esc(featured)}</a><br>${pr?'<a href="#promocion">Promociones</a><br>':""}<a href="#nosotros">Nosotros</a></div>
    <div><h4>Atención</h4>${st.phone?`<a href="${esc(wa("Hola 👋"))}" target="_blank" rel="noopener">WhatsApp</a><br>`:""}<a href="#" data-act="reg">Registro de clientes</a><br><a href="#" data-act="priv">Aviso de privacidad</a></div></div>
    <div class="wrap legal">© ${new Date().getFullYear()} Lechuga &amp; Co.${C.publishedAt?` · Catálogo actualizado el ${new Date(C.publishedAt).toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}. Existencias sujetas a disponibilidad.`:""}</div></footer>`;
  h+=sheetHTML(all)+bagHTML()+regHTML()+privHTML();
  const f=document.activeElement&&document.activeElement.id,sel=f&&document.activeElement.selectionStart;
  $("#app").innerHTML=h;
  if(f){const el=document.getElementById(f);if(el){el.focus();try{el.setSelectionRange(sel,sel)}catch{}}}
}
function sheetHTML(all){
  const m=U.open&&all.find(x=>x.key===U.open);if(!m)return "";
  const col=colorOf(m),sel=col.sizes.find(s=>s.id===U.size),it=sel&&C.items.find(i=>i.id===sel.id),specs=specsOf(m.desc);
  const ask=wa(`Hola ${C.settings.name} 👋 Me interesa: ${m.name}${col.color?" ("+col.color+")":""}${sel?", talla "+sel.size:""}. ¿Está disponible?`);
  return `<div class="shade" data-act="close"></div><aside class="sheet" role="dialog" aria-modal="true" aria-label="${esc(m.name)}"><button class="x" data-act="close">Cerrar ✕</button>
    <div class="ph" style="border-radius:6px">${pic({photo:col.photo||m.photo,name:m.name,color:col.color})}</div>
    <div style="display:grid;gap:6px"><div class="lab" style="color:var(--gold-dk)">${esc(m.season||"")}</div><h2>${esc(m.name)}</h2><div class="price">${money(it?it.price:m.price)}</div></div>
    ${m.colors.length>1||col.color?`<div style="display:grid;gap:8px"><div class="lab">Color: <span style="font-weight:600;letter-spacing:.05em;text-transform:none">${esc(col.color||"")}</span></div><div class="sizes">${m.colors.map(c=>`<button class="size" data-act="color" data-k="${esc(c.color)}" aria-pressed="${c===col}" style="display:flex;gap:8px;align-items:center"><i style="width:14px;height:14px;border-radius:50%;border:1px solid #c9c4b8;background:${COLORS[norm(c.color)]||"#ddd"}"></i>${esc(c.color)}</button>`).join("")}</div></div>`:""}
    <div style="display:grid;gap:8px"><div class="lab">Elige tu talla</div><div class="sizes">${col.sizes.map(s=>`<button class="size" data-act="size" data-k="${esc(s.id)}" aria-pressed="${U.size===s.id}" ${s.stock<=0?"disabled":""}>${esc(s.size)}</button>`).join("")}</div>
      ${sel&&measureOf(sel.desc)?`<div class="note">Medidas talla ${esc(sel.size)}: ${esc(measureOf(sel.desc))}</div>`:""}${sel&&sel.stock<=2?`<div class="note">Quedan pocas piezas en esta talla.</div>`:""}</div>
    <button class="btn dark" data-act="add" ${sel?"":"disabled"}>${sel?"Añadir a la cesta":"Selecciona una talla"}</button>
    ${ask?`<a class="btn wa" href="${esc(ask)}" target="_blank" rel="noopener">Preguntar por WhatsApp</a>`:""}
    ${specs.length?`<div style="display:grid;gap:6px"><div class="lab">Características</div><ul class="specs">${specs.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`:""}</aside>`;
}
function bagHTML(){
  if(!U.showBag)return "";
  const st=C.settings,pr=promo(),sub=U.bag.reduce((a,b)=>a+b.qty*b.price,0);
  const eligible=pr&&U.firstBuy&&sub>=pr.minimum,disc=eligible?Math.round(sub*pr.percent)/100:0,total=sub-disc;
  const text=`Hola ${st.name} 👋 Quiero hacer este pedido:\n\n${U.bag.map(b=>`• ${b.qty} x ${b.name}${b.color?" – "+b.color:""} – Talla ${b.size} – ${money(b.qty*b.price)}`).join("\n")}\n\nSubtotal: ${money(sub)}${eligible?`\nSoy cliente registrado y es mi primera compra: ${pr.percent}% de descuento (−${money(disc)})\nTotal estimado: ${money(total)}`:""}\n\nMi nombre: `;
  const order=U.bag.length?wa(text):"";
  return `<div class="shade" data-act="close-bag"></div><aside class="sheet" role="dialog" aria-modal="true" aria-label="Cesta"><div class="row" style="align-items:center"><h2>Cesta</h2><button class="x" data-act="close-bag">Cerrar ✕</button></div>
    ${U.bag.length?`<div>${U.bag.map((b,i)=>`<div class="line"><div class="ph">${pic({photo:b.photo,name:b.name},false)}</div><div style="min-width:0"><div style="font:600 .88rem var(--f-title)">${esc(b.name)}</div><div class="note">${esc([b.color,"Talla "+b.size].filter(Boolean).join(" · "))}</div><div class="qty"><button data-act="dec" data-k="${i}" aria-label="Quitar uno">−</button><span>${b.qty}</span><button data-act="inc" data-k="${i}" aria-label="Agregar uno">+</button></div></div><div>${money(b.qty*b.price)}</div></div>`).join("")}</div>
      ${pr?`<div class="box"><label><input type="checkbox" id="first" ${U.firstBuy?"checked":""}> <span>Soy cliente registrado y es mi <b>primera compra</b> (${pr.percent}% desde ${money(pr.minimum)})</span></label>
        ${U.firstBuy&&sub<pr.minimum?`<span class="note">Agrega ${money(pr.minimum-sub)} más para tu descuento.</span>`:""}
        ${!U.firstBuy?`<span class="note">¿Aún no te registras? <a href="#" data-act="reg">Regístrate aquí</a>, es gratis.</span>`:""}</div>`:""}
      <div class="row"><span>Subtotal</span><span>${money(sub)}</span></div>
      ${disc?`<div class="row" style="color:var(--good)"><span>Primera compra (${pr.percent}%)</span><span>−${money(disc)}</span></div>`:""}
      <div class="row tot"><span>Total${disc?" estimado":""}</span><span>${money(total)}</span></div>
      ${order?`<a class="btn wa" href="${esc(order)}" target="_blank" rel="noopener">Enviar pedido por WhatsApp</a><p class="note" style="margin:0">Se abre WhatsApp con tu pedido escrito. Te confirmamos existencias, pago y entrega.${disc?" El descuento se confirma con tu número registrado.":""}</p>`:`<p class="note">Pronto podrás enviar tu pedido por WhatsApp.</p>`}`
    :`<p class="note">Tu cesta está vacía.</p>`}</aside>`;
}
function regHTML(){
  if(!U.reg)return "";const pr=promo();
  return `<div class="shade" data-act="close-reg"></div><aside class="sheet" role="dialog" aria-modal="true" aria-label="Registro de clientes"><div class="row" style="align-items:center"><h2>Regístrate</h2><button class="x" data-act="close-reg">Cerrar ✕</button></div>
    <p style="margin:0">${pr?`Obtén <b>${pr.percent}% de descuento en tu primera compra</b> desde ${money(pr.minimum)}${pr.end?`, válido hasta el ${fdate(pr.end)}`:""}.`:"Regístrate para recibir avisos de nuevas colecciones."}</p>
    ${U.regMsg?`<div class="msg ${U.regMsg.ok?"good":"bad"}">${U.regMsg.html}</div>`:""}
    ${U.regMsg&&U.regMsg.ok?"":`<form class="reg" id="f-reg"><label>Nombre<input type="text" id="r-name" autocomplete="name" required></label>
      <label>WhatsApp (10 dígitos)<input type="tel" id="r-phone" autocomplete="tel" inputmode="tel" required></label>
      <label>Correo (opcional)<input type="email" id="r-mail" autocomplete="email"></label>
      <label class="ok"><input type="checkbox" id="r-ok" required> <span>Acepto el <a href="#" data-act="priv">aviso de privacidad</a>.</span></label>
      <button class="btn dark" type="submit">Registrarme</button>
      <p class="note" style="margin:0">Tu descuento queda ligado a tu número de WhatsApp. Al comprar, da ese mismo número.</p></form>`}</aside>`;
}
function privHTML(){
  if(!U.priv)return "";const st=C.settings;
  return `<div class="shade" data-act="close-priv" style="z-index:32"></div><aside class="sheet" role="dialog" aria-modal="true" aria-label="Aviso de privacidad" style="z-index:33"><div class="row" style="align-items:center"><h2>Aviso de privacidad</h2><button class="x" data-act="close-priv">Cerrar ✕</button></div>
    <p style="margin:0"><b>${esc(st.name)}</b>, con domicilio en ${esc(st.city||"México")}, es responsable del tratamiento de tus datos personales.</p>
    <p style="margin:0"><b>Datos que pedimos:</b> nombre, número de WhatsApp y, si quieres, correo electrónico.</p>
    <p style="margin:0"><b>Para qué los usamos:</b> identificarte como cliente registrado para aplicar tu descuento de primera compra, atender tus pedidos y, si no te opones, avisarte de nuevas colecciones y promociones.</p>
    <p style="margin:0"><b>No vendemos ni compartimos</b> tus datos con terceros.</p>
    <p style="margin:0"><b>Tus derechos:</b> puedes pedir acceso, corrección o eliminación de tus datos, u oponerte a recibir avisos, escribiéndonos por WhatsApp${st.phone?` al <span style="user-select:all">${esc(st.phone)}</span>`:""}.</p></aside>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,k=b.dataset.k;
  if(b.tagName==="A"&&b.getAttribute("href")==="#")e.preventDefault();
  if(a==="cat"){U.cat=k;U.season=""}
  else if(a==="season"){U.season=k}
  else if(a==="open"){U.open=k;U.size=null;const m=groups().find(x=>x.key===k);if(m){U.color=m.colors[0].color;const ok=m.colors[0].sizes.filter(s=>s.stock>0);if(ok.length===1)U.size=ok[0].id}}
  else if(a==="color"){U.color=k;U.size=null}
  else if(a==="close"){U.open=null}
  else if(a==="size"){U.size=k}
  else if(a==="add"){const it=C.items.find(i=>i.id===U.size);if(!it)return;const m=groups().find(x=>x.key===U.open),col=m&&colorOf(m);
    const ex=U.bag.find(x=>x.id===it.id);ex?ex.qty++:U.bag.push({id:it.id,qty:1,name:it.name,color:it.color,size:it.size||"Única",price:it.price,photo:(col&&col.photo)||(m&&m.photo)||""});
    saveBag();U.open=null;U.showBag=true}
  else if(a==="bag"){U.showBag=true}
  else if(a==="close-bag"){U.showBag=false}
  else if(a==="inc"){U.bag[k].qty++;saveBag()}
  else if(a==="dec"){U.bag[k].qty--;if(U.bag[k].qty<=0)U.bag.splice(k,1);saveBag()}
  else if(a==="reg"){U.reg=true;U.showBag=false;U.regMsg=null}
  else if(a==="close-reg"){U.reg=false}
  else if(a==="priv"){U.priv=true}
  else if(a==="close-priv"){U.priv=false}
  else return;
  if(a==="cat"&&b.tagName!=="A")document.getElementById("coleccion")?.scrollIntoView();
  render();
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){U.q=e.target.value;render()}
  if(e.target.id==="first"){U.firstBuy=e.target.checked;try{localStorage.setItem("lc-registrado",U.firstBuy?"1":"0")}catch{}render()}
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="f-reg")return;e.preventDefault();
  const name=$("#r-name").value.trim(),phone=$("#r-phone").value.trim(),email=$("#r-mail").value.trim(),btn=e.target.querySelector("button");
  btn.disabled=true;
  const done=()=>{U.firstBuy=true;try{localStorage.setItem("lc-registrado","1")}catch{}};
  try{
    if(!API)throw new Error("offline");
    const r=await fetch(API+"/api/public/registro",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,phone,email,acepta:true})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){U.regMsg={ok:false,html:esc(j.error||"No se pudo registrar. Intenta de nuevo.")};btn.disabled=false;render();return}
    done();const pr=promo();
    U.regMsg={ok:true,html:j.existing?`¡Ya estabas registrado, ${esc(name)}! ${pr?"Tu descuento sigue disponible si aún no haces tu primera compra.":""}`:`¡Listo, ${esc(name)}! ${pr?`Tienes <b>${pr.percent}%</b> en tu primera compra desde ${money(pr.minimum)}.`:"Te avisaremos de las novedades."}`};
  }catch{
    // La PC de la tienda está apagada: el registro se manda por WhatsApp y se captura en la caja.
    const link=wa(`Hola ${C.settings.name} 👋 Quiero registrarme como cliente.\nNombre: ${name}\nWhatsApp: ${phone}${email?"\nCorreo: "+email:""}\nAcepto el aviso de privacidad.`);
    if(link){done();U.regMsg={ok:true,html:`Ahora mismo no podemos registrarte en línea. <a href="${esc(link)}" target="_blank" rel="noopener"><b>Envíanos tu registro por WhatsApp</b></a> y lo confirmamos.`}}
    else U.regMsg={ok:false,html:"No pudimos registrarte en este momento. Intenta más tarde."};
  }
  render();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(U.open||U.showBag||U.reg||U.priv)){U.open=null;U.showBag=false;U.reg=false;U.priv=false;render()}});
Promise.all([
  fetch("catalogo.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).catch(()=>null),
  fetch("config.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null),
]).then(([d,cfg])=>{
  // En la PC de la tienda el servidor es la misma dirección; desde GitHub, el del túnel.
  if(!/github\.io$/i.test(location.hostname)&&location.protocol.startsWith("http"))API=location.origin;
  else if(cfg&&cfg.api)API=String(cfg.api).replace(/\/$/,"");
  if(d){C=d;const ids=new Set(d.items.filter(i=>i.stock>0).map(i=>i.id));U.bag=U.bag.filter(b=>ids.has(b.id)&&b.qty>0);saveBag()}
  render();
});
</script>
</body>
